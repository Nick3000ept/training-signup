<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Альфа Строй. Работаем с ИИ.</title>
<style>
  :root {
    --blue: #0071e3;
    --blue-hover: #0077ed;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --hairline: #d2d2d7;
    --seg-bg: #e8e8ed;
    --ok: #248a3d;
    --err: #d70015;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(251, 251, 253, .8);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0, 0, 0, .08);
  }
  .head-inner {
    max-width: 680px;
    margin: 0 auto;
    padding: 18px 20px 14px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.021em;
    margin-bottom: 14px;
  }
  nav {
    display: flex;
    background: var(--seg-bg);
    border-radius: 12px;
    padding: 3px;
    gap: 2px;
    overflow-x: auto;
  }
  nav button {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text);
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s ease, box-shadow .2s ease, color .2s ease;
  }
  nav button.active {
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    font-weight: 600;
  }
  main { max-width: 680px; margin: 0 auto; padding: 28px 20px 80px; }
  .tab { display: none; animation: fadein .25s ease; }
  .tab.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 18px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .04);
  }
  .lead {
    font-size: 15px;
    color: var(--muted);
    letter-spacing: -0.01em;
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: -0.005em;
    margin: 18px 0 7px;
  }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 13px 14px;
    font-size: 17px;
    font-family: inherit;
    letter-spacing: -0.01em;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='8' viewBox='0 0 14 8'%3E%3Cpath d='M1 1l6 6 6-6' fill='none' stroke='%236e6e73' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 40px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(0, 113, 227, .15);
  }
  ::placeholder { color: #aeaeb2; }
  .btn {
    margin-top: 24px;
    width: 100%;
    padding: 13px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    font-family: inherit;
    color: #fff;
    background: var(--blue);
    border: none;
    border-radius: 980px;
    cursor: pointer;
    transition: background .2s ease, transform .1s ease;
  }
  .btn:hover { background: var(--blue-hover); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .msg { margin-top: 14px; font-size: 14px; letter-spacing: -0.005em; text-align: center; display: none; }
  .msg.ok { color: var(--ok); display: block; }
  .msg.err { color: var(--err); display: block; }
  .total {
    font-size: 15px;
    color: var(--muted);
    letter-spacing: -0.01em;
    margin-bottom: 18px;
  }
  .dept-group {
    background: var(--card);
    border-radius: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .04);
    overflow: hidden;
  }
  .dept-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px 12px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .dept-title .cnt {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    background: var(--seg-bg);
    border-radius: 980px;
    padding: 3px 10px;
  }
  .person {
    padding: 12px 20px;
    font-size: 16px;
    letter-spacing: -0.01em;
    border-top: 1px solid rgba(0, 0, 0, .06);
  }
  .placeholder { color: var(--muted); font-size: 16px; letter-spacing: -0.01em; }
  .mat-title {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin-bottom: 6px;
  }
  .mat-note { color: var(--muted); font-size: 15px; letter-spacing: -0.01em; margin-bottom: 20px; }
  .mat-link {
    display: inline-block;
    color: #fff;
    background: var(--blue);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 980px;
    transition: background .2s ease;
  }
  .mat-link:hover { background: var(--blue-hover); }
  .loading { color: var(--muted); font-size: 15px; }
  @media (max-width: 480px) {
    h1 { font-size: 23px; }
    .card { padding: 22px 18px; }
    nav button { font-size: 13px; padding: 8px 6px; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <h1>Альфа Строй. Работаем с ИИ.</h1>
    <nav>
      <button class="active" data-tab="signup">Запись</button>
      <button data-tab="people">Участники</button>
      <button data-tab="program">Программа</button>
      <button data-tab="materials">Материалы</button>
    </nav>
  </div>
</header>

<main>

  <section id="tab-signup" class="tab active">
    <div class="card">
      <p class="lead">Укажите своё ФИО и выберите отдел — и вы в списке участников.</p>
      <label for="fio">ФИО</label>
      <input id="fio" type="text" placeholder="Иванов Иван Иванович" maxlength="100" autocomplete="name">
      <label for="dept">Отдел</label>
      <select id="dept"><option value="">Загрузка…</option></select>
      <button class="btn" id="saveBtn">Записаться</button>
      <div class="msg" id="saveMsg"></div>
    </div>
  </section>

  <section id="tab-people" class="tab">
    <div class="total" id="total"></div>
    <div id="peopleList" class="loading">Загрузка списка…</div>
  </section>

  <section id="tab-program" class="tab">
    <div class="card">
      <p class="placeholder">Программа обучения будет добавлена позже.</p>
    </div>
  </section>

  <section id="tab-materials" class="tab">
    <div class="card">
      <p class="mat-title">Видео</p>
      <p class="mat-note">Видео Александра Орлова у Комаровского.</p>
      <a class="mat-link" href="https://disk.yandex.ru/i/MGqfmU_kIw1ctg" target="_blank" rel="noopener">Смотреть видео</a>
    </div>
  </section>

</main>

<script>
const BASE = 'https://script.google.com/macros/s/AKfycbx4OoQXUlWmbVgfQbYkDM_S5YTFRuUuYOKbC03dajF33mIL9QsOCFaLY_GL3cYsTl--/exec';
const CACHE_KEY = 'training_signup_snapshot_v1';

let departments = [];
let participants = [];

// --- вкладки ---
document.querySelectorAll('nav button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('nav button').forEach(function (b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// --- сеть с ретраями ---
async function fetchJson(url, options, tries) {
  tries = tries || 3;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const resp = await fetch(url, options);
      const text = await resp.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error('Сервер вернул не данные, а страницу ошибки');
      }
    } catch (e) {
      lastErr = e;
      if (i < tries - 1) await new Promise(function (r) { setTimeout(r, 1200 * (i + 1)); });
    }
  }
  throw lastErr;
}

// --- отрисовка ---
function renderDepartments() {
  const sel = document.getElementById('dept');
  const current = sel.value;
  sel.innerHTML = '<option value="">— выберите отдел —</option>' +
    departments.map(function (d) {
      return '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>';
    }).join('');
  if (current && departments.indexOf(current) !== -1) sel.value = current;
}

function renderParticipants() {
  const box = document.getElementById('peopleList');
  const total = document.getElementById('total');
  box.classList.remove('loading');
  if (!departments.length && !participants.length) {
    total.textContent = '';
    box.innerHTML = '<p class="placeholder">Список отделов ещё не загрузился — обновите страницу.</p>';
    return;
  }
  total.textContent = 'Всего участников: ' + participants.length;

  const order = departments.slice();
  participants.forEach(function (p) {
    if (order.indexOf(p.dept) === -1) order.push(p.dept || 'Без отдела');
  });

  let html = '';
  order.forEach(function (dept) {
    const people = participants.filter(function (p) { return (p.dept || 'Без отдела') === dept; });
    html += '<div class="dept-group"><div class="dept-title"><span>' + escapeHtml(dept) +
      '</span><span class="cnt">' + people.length + '</span></div>';
    people.forEach(function (p) {
      html += '<div class="person">' + escapeHtml(p.fio) + '</div>';
    });
    html += '</div>';
  });
  box.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function applySnapshot(data) {
  departments = data.departments || [];
  participants = data.participants || [];
  renderDepartments();
  renderParticipants();
}

// --- загрузка ---
async function load() {
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) applySnapshot(JSON.parse(cached));
  } catch (e) { /* кэш недоступен — не страшно */ }

  try {
    const data = await fetchJson(BASE + '?action=load');
    if (data.ok) {
      applySnapshot(data);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    } else {
      showLoadError(data.error);
    }
  } catch (e) {
    showLoadError(e.message);
  }
}

function showLoadError(text) {
  if (!departments.length) {
    document.getElementById('dept').innerHTML = '<option value="">Не удалось загрузить</option>';
    document.getElementById('peopleList').innerHTML =
      '<p class="placeholder">Не удалось загрузить список: ' + escapeHtml(text || 'ошибка сети') +
      '. Обновите страницу.</p>';
  }
}

// --- запись ---
document.getElementById('saveBtn').addEventListener('click', async function () {
  const fio = document.getElementById('fio').value.trim();
  const dept = document.getElementById('dept').value;
  const msg = document.getElementById('saveMsg');
  const btn = this;
  msg.className = 'msg';

  if (fio.length < 3) { msg.className = 'msg err'; msg.textContent = 'Укажите ФИО.'; return; }
  if (!dept) { msg.className = 'msg err'; msg.textContent = 'Выберите отдел.'; return; }

  btn.disabled = true;
  btn.textContent = 'Записываем…';
  try {
    const data = await fetchJson(BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'save', fio: fio, dept: dept })
    }, 2);
    if (data.ok) {
      participants = data.participants || participants;
      renderParticipants();
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ departments: departments, participants: participants }));
      } catch (e) {}
      msg.className = 'msg ok';
      msg.textContent = 'Готово! Вы записаны: ' + fio + ' — ' + dept + '.';
      document.getElementById('fio').value = '';
    } else {
      msg.className = 'msg err';
      msg.textContent = data.error || 'Не удалось записаться, попробуйте ещё раз.';
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = 'Ошибка сети: ' + e.message + '. Попробуйте ещё раз.';
  }
  btn.disabled = false;
  btn.textContent = 'Записаться';
});

load();
</script>
</body>
</html>
